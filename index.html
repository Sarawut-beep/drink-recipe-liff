<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบค้นหาสูตรเครื่องดื่ม</title>

  <!-- เริ่มจับเวลาทันทีที่หน้าเว็บเริ่มทำงาน -->
  <script>
    window.__pageLoadStart =
      performance.now();
  </script>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    p {
      color: #666;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      display: block;
      width: 128px;
      max-width: 42%;
      height: auto;
      margin: 0 auto 14px;
      object-fit: contain;
    }

    .subtitle {
      margin: 6px 0 0;
      color: #777;
      font-size: 15px;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #f0f0f0;
      margin-top: 18px;
      line-height: 1.6;
    }

    .success {
      background: #e8f5e9;
    }

    .error {
      background: #ffebee;
    }

    .hidden {
      display: none;
    }

    .form-group {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: #f15a24;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .primary-button {
      background: #f15a24;
      color: white;
      font-weight: bold;
    }

    .secondary-button {
      background: #eeeeee;
      color: #222;
    }

    .primary-button:hover {
      background: #d94b1b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .user-info {
      margin-bottom: 18px;
      padding: 12px;
      background: #f4fbf6;
      border-radius: 10px;
    }

    .search-wrapper {
      position: relative;
    }

    .suggestion-list {

    .suggestion-button {
      background: #ffffff;

    }

    .suggestion-button:hover {
      background: #f6f6f6;
    }

    .search-message {
      margin-top: 14px;
      color: #666;
      font-size: 14px;
    }

    .recipe-card {
      margin-top: 20px;
    }

    .recipe-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .step-item {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .step-number {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .loading {
      opacity: 0.7;
    }
  
    /* =====================================================
       Debug Panel - แสดงเฉพาะเมื่อ URL มี ?debug=1
       ===================================================== */

    .debug-panel {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #111827;
      color: #f9fafb;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .debug-panel.hidden {
      display: none;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- ================================================= -->
    <!-- Header -->
    <!-- ================================================= -->

    <div class="card">

      <div class="brand-header">

        <img
          src="assets/kudsan-logo.png"
          alt="โลโก้ KUDSAN"
          class="brand-logo"
        >

        <h1>ระบบค้นหาสูตรเครื่องดื่ม</h1>

        <p class="subtitle">
          Drink Recipe Search System
        </p>

      </div>


      <!-- ================================================= -->
      <!-- สถานะระบบ -->
      <!-- ================================================= -->

      <div
        id="status"
        class="status"
      >
        กำลังเชื่อมต่อกับ LINE...
      </div>


      <!-- ================================================= -->
      <!-- หน้าลงทะเบียน -->
      <!-- ================================================= -->

      <div
        id="registerSection"
        class="hidden"
      >

        <div class="form-group">

          <label for="employeeId">
            รหัสพนักงาน
          </label>

          <input
            type="text"
            id="employeeId"
            placeholder="กรอกรหัสพนักงาน"
            inputmode="numeric"
            autocomplete="off"
          >

        </div>


        <button
          id="registerButton"
          class="primary-button"
          onclick="registerUser()"
        >
          ลงทะเบียน
        </button>

      </div>


      <!-- ================================================= -->
      <!-- หน้าค้นหาสูตร -->
      <!-- ================================================= -->

      <div
        id="searchSection"
        class="hidden"
      >

        <div
          id="userInfo"
          class="user-info"
        ></div>


        <div class="form-group">

          <label for="searchInput">
            ค้นหาเมนูเครื่องดื่ม
          </label>


          <div class="search-wrapper">

            <input
              type="text"
              id="searchInput"
              placeholder="พิมพ์ชื่อเมนู..."
              autocomplete="off"
            >

          </div>

        </div>


        <button
          id="searchButton"
          class="primary-button"
          onclick="manualSearch()"
        >
          ค้นหา
        </button>


        <div
          id="searchMessage"
          class="search-message"
        ></div>


        <!-- รายการแนะนำ -->
        <div
          id="suggestionList"
          class="suggestion-list"
        ></div>


        <!-- สูตร -->
        <div
          id="recipeSection"
          class="recipe-card hidden"
        >

          <div
            id="recipeTitle"
            class="recipe-title"
          ></div>


          <div
            id="recipeSteps"
          ></div>


          <button
            class="secondary-button"
            onclick="clearRecipe()"
          >
            ค้นหาเมนูอื่น
          </button>

        </div>

      </div>

    </div>

    <div
      id="debugPanel"
      class="debug-panel hidden"
    ></div>

  </div>


<script>

  // =====================================================
  // ตั้งค่า LIFF
  // =====================================================

  const LIFF_ID =
    '2010750055-ukl2mGbL';


  // =====================================================
  // ใส่ Apps Script Web App URL ที่ลงท้ายด้วย /exec
  // =====================================================

  const API_URL =
    'https://script.google.com/macros/s/AKfycbzqJwPDxPBDX3ARXPowoUOIZfdtm4qgVC6EzO6AMg67qI8HjSWS8QXeKcQ45XYmTcFd/exec';


  // =====================================================
  // ตัวแปรระบบ
  // =====================================================

  let currentIdToken =
    null;

  let currentUser =
    null;

  let menuCache =
    [];

  let searchTimer =
    null;


  // =====================================================
  // STEP 5: Menu Name Cache
  //
  // เก็บเฉพาะชื่อเมนูใน localStorage
  // ไม่เก็บสูตร, STEP, User, Token, Status หรือ Log
  //
  // อายุ Cache = 48 ชั่วโมง
  // =====================================================

  const MENU_CACHE_STORAGE_KEY =
    'kudsan_menu_names_v1';

  const MENU_CACHE_SAVED_AT_KEY =
    'kudsan_menu_names_saved_at_v1';

  const MENU_CACHE_TTL_MS =
    48 * 60 * 60 * 1000;


  function normalizeMenuNames(
    menus
  ) {

    if (
      !Array.isArray(
        menus
      )
    ) {

      return [];

    }


    return menus
      .map(
        function(
          item
        ) {

          const menuName =
            String(
              item &&
              item.menuName
                ? item.menuName
                : ''
            ).trim();


          return {
            menuName:
              menuName
          };

        }
      )
      .filter(
        function(
          item
        ) {

          return (
            item.menuName.length > 0
          );

        }
      );

  }


  function readMenuCacheFromStorage() {

    try {

      const rawMenus =
        localStorage.getItem(
          MENU_CACHE_STORAGE_KEY
        );


      const rawSavedAt =
        localStorage.getItem(
          MENU_CACHE_SAVED_AT_KEY
        );


      if (
        !rawMenus ||
        !rawSavedAt
      ) {

        return {
          menus: [],
          ageMs: null,
          fresh: false
        };

      }


      const savedAt =
        Number(
          rawSavedAt
        );


      if (
        !Number.isFinite(
          savedAt
        ) ||
        savedAt <= 0
      ) {

        throw new Error(
          'เวลาของ Menu Cache ไม่ถูกต้อง'
        );

      }


      const parsedMenus =
        JSON.parse(
          rawMenus
        );


      const menus =
        normalizeMenuNames(
          parsedMenus
        );


      if (
        menus.length === 0
      ) {

        throw new Error(
          'Menu Cache ว่าง'
        );

      }


      const ageMs =
        Math.max(
          0,
          Date.now() -
          savedAt
        );


      return {
        menus:
          menus,

        ageMs:
          ageMs,

        fresh:
          ageMs <=
          MENU_CACHE_TTL_MS
      };


    } catch (
      error
    ) {

      console.warn(
        '[Menu Cache] อ่าน Cache ไม่สำเร็จ:',
        error
      );


      try {

        localStorage.removeItem(
          MENU_CACHE_STORAGE_KEY
        );


        localStorage.removeItem(
          MENU_CACHE_SAVED_AT_KEY
        );

      } catch (
        clearError
      ) {

        console.warn(
          '[Menu Cache] ล้าง Cache ไม่สำเร็จ:',
          clearError
        );

      }


      return {
        menus: [],
        ageMs: null,
        fresh: false
      };

    }

  }


  function writeMenuCacheToStorage(
    menus
  ) {

    const safeMenus =
      normalizeMenuNames(
        menus
      );


    if (
      safeMenus.length === 0
    ) {

      return false;

    }


    try {

      localStorage.setItem(
        MENU_CACHE_STORAGE_KEY,
        JSON.stringify(
          safeMenus
        )
      );


      localStorage.setItem(
        MENU_CACHE_SAVED_AT_KEY,
        String(
          Date.now()
        )
      );


      return true;


    } catch (
      error
    ) {

      console.warn(
        '[Menu Cache] บันทึก Cache ไม่สำเร็จ:',
        error
      );


      return false;

    }

  }


  function formatMenuCacheAge(
    ageMs
  ) {

    if (
      ageMs === null ||
      ageMs === undefined
    ) {

      return '-';

    }


    if (
      ageMs < 60 * 1000
    ) {

      return (
        Math.round(
          ageMs / 1000
        ) +
        ' วินาที'
      );

    }


    if (
      ageMs < 60 * 60 * 1000
    ) {

      return (
        Math.round(
          ageMs / (60 * 1000)
        ) +
        ' นาที'
      );

    }


    return (
      (
        ageMs /
        (60 * 60 * 1000)
      ).toFixed(
        1
      ) +
      ' ชั่วโมง'
    );

  }


  // =====================================================
  // STEP 3: Developer Diagnostics
  //
  // เปิดใช้งานด้วย ?debug=1
  // ตัวอย่าง:
  // https://.../index.html?debug=1
  //
  // ไม่เขียนข้อมูลลง Google Sheets
  // ไม่เปลี่ยน Flow การทำงานหลัก
  // =====================================================

  const DEBUG_MODE =
    new URLSearchParams(
      window.location.search
    ).get(
      'debug'
    ) === '1';


  const pageDiagnostics = {

    liffInitTime:
      null,

    checkUserTime:
      null,

    getMenuListTime:
      null,

    renderTime:
      null,

    pageLoadTime:
      null,

    retries: {

      checkUser:
        0,

      getMenuList:
        0,

      getRecipe:
        0

    },

    lastHttpStatus: {

      checkUser:
        null,

      getMenuList:
        null,

      getRecipe:
        null

    },


    backend: {

      checkUser:
        null,

      getMenuList:
        null,

      getRecipe:
        null

    },


    menuCacheSource:
      '-',


    menuCacheAgeMs:
      null,


    backgroundMenuRefresh:
      'not-started'

  };


  function saveBackendDiagnostics(
    action,
    result
  ) {

    if (
      !DEBUG_MODE ||
      !result ||
      !result._debug ||
      !Object.prototype.hasOwnProperty.call(
        pageDiagnostics.backend,
        action
      )
    ) {

      return;

    }


    pageDiagnostics.backend[
      action
    ] =
      result._debug;


    updateDebugPanel();

  }


  function backendDiagnosticText(
    title,
    data
  ) {

    if (!data) {

      return (
        title +
        '\n' +
        '  ยังไม่มีข้อมูล\n'
      );

    }


    return (
      title +
      '\n' +
      '  LINE Verify      : ' +
      formatDiagnosticTime(
        data.lineVerifyMs
      ) +
      '\n' +
      '  Spreadsheet Open : ' +
      formatDiagnosticTime(
        data.spreadsheetOpenMs
      ) +
      '\n' +
      '  Resolve Sheets   : ' +
      formatDiagnosticTime(
        data.sheetResolveMs
      ) +
      '\n' +
      '  User Lookup      : ' +
      formatDiagnosticTime(
        data.userLookupMs
      ) +
      '\n' +
      '  Menu Read        : ' +
      formatDiagnosticTime(
        data.menuReadMs
      ) +
      '\n' +
      '  Recipe Read      : ' +
      formatDiagnosticTime(
        data.recipeReadMs
      ) +
      '\n' +
      '  Server Measured  : ' +
      formatDiagnosticTime(
        data.serverMeasuredMs
      ) +
      '\n'
    );

  }


  function formatDiagnosticTime(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return '-';

    }


    return (
      value +
      ' ms (' +
      (
        value / 1000
      ).toFixed(
        2
      ) +
      ' s)'
    );

  }


  function updateDebugPanel() {

    if (!DEBUG_MODE) {
      return;
    }


    const panel =
      document.getElementById(
        'debugPanel'
      );


    if (!panel) {
      return;
    }


    panel.classList.remove(
      'hidden'
    );


    panel.textContent =
      'Developer Diagnostics\n' +
      '-----------------------------\n' +
      'LIFF Init       : ' +
      formatDiagnosticTime(
        pageDiagnostics.liffInitTime
      ) +
      '\n' +
      'Check User API  : ' +
      formatDiagnosticTime(
        pageDiagnostics.checkUserTime
      ) +
      '\n' +
      'Get Menu List   : ' +
      formatDiagnosticTime(
        pageDiagnostics.getMenuListTime
      ) +
      '\n' +
      'Render          : ' +
      formatDiagnosticTime(
        pageDiagnostics.renderTime
      ) +
      '\n' +
      'Page Load Total : ' +
      formatDiagnosticTime(
        pageDiagnostics.pageLoadTime
      ) +
      '\n' +
      'Menu Source     : ' +
      pageDiagnostics.menuCacheSource +
      '\n' +
      'Menu Cache Age  : ' +
      formatMenuCacheAge(
        pageDiagnostics.menuCacheAgeMs
      ) +
      '\n' +
      'Background Menu : ' +
      pageDiagnostics.backgroundMenuRefresh +
      '\n\n' +
      'Retry Count\n' +
      'checkUser       : ' +
      pageDiagnostics.retries.checkUser +
      '\n' +
      'getMenuList     : ' +
      pageDiagnostics.retries.getMenuList +
      '\n' +
      'getRecipe       : ' +
      pageDiagnostics.retries.getRecipe +
      '\n\n' +
      'Last HTTP Status\n' +
      'checkUser       : ' +
      (
        pageDiagnostics.lastHttpStatus.checkUser ??
        '-'
      ) +
      '\n' +
      'getMenuList     : ' +
      (
        pageDiagnostics.lastHttpStatus.getMenuList ??
        '-'
      ) +
      '\n' +
      'getRecipe       : ' +
      (
        pageDiagnostics.lastHttpStatus.getRecipe ??
        '-'
      ) +
      '\n\n' +
      'Backend Diagnostics\n' +
      '-----------------------------\n' +
      backendDiagnosticText(
        'Check User',
        pageDiagnostics.backend.checkUser
      ) +
      '\n' +
      backendDiagnosticText(
        'Get Menu List',
        pageDiagnostics.backend.getMenuList
      ) +
      '\n' +
      backendDiagnosticText(
        'Get Recipe',
        pageDiagnostics.backend.getRecipe
      );

  }


  // =====================================================
  // ตัวแปรจับเวลาประสิทธิภาพ
  // =====================================================

  let pageLoadStart =
    window.__pageLoadStart ||
    performance.now();

  let pageLoadTime =
    0;

  let searchStartTime =
    null;

  let searchTaskTime =
    0;

  let totalRetrievalTime =
    0;


  // =====================================================
  // เริ่มต้น LIFF
  // =====================================================

  async function initializeLiff() {

    const statusElement =
      document.getElementById(
        'status'
      );


    try {

      statusElement.className =
        'status';


      statusElement.innerHTML =
        'กำลังเชื่อมต่อกับ LINE...';


      const liffInitStartedAt =
        performance.now();


      await liff.init({
        liffId:
          LIFF_ID
      });


      pageDiagnostics.liffInitTime =
        Math.round(
          performance.now() -
          liffInitStartedAt
        );


      updateDebugPanel();


      if (
        !liff.isLoggedIn()
      ) {

        liff.login();

        return;

      }


      currentIdToken =
        liff.getIDToken();


      if (
        !currentIdToken
      ) {

        throw new Error(
          'ไม่สามารถรับข้อมูลยืนยันตัวตนจาก LINE ได้'
        );

      }


      statusElement.innerHTML =
        'กำลังตรวจสอบสิทธิ์ผู้ใช้งาน...';


      const checkUserStartedAt =
        performance.now();


      const result =
        await callApi({

          source:
            'LIFF',

          action:
            'checkUser',

          idToken:
            currentIdToken,

          debug:
            DEBUG_MODE

        });


      saveBackendDiagnostics(
        'checkUser',
        result
      );


      pageDiagnostics.checkUserTime =
        Math.round(
          performance.now() -
          checkUserStartedAt
        );


      updateDebugPanel();


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          'ไม่สามารถตรวจสอบผู้ใช้ได้'
        );

      }


      // =================================================
      // ยังไม่ลงทะเบียน
      // =================================================

      if (
        !result.registered
      ) {

        showRegisterScreen();

        return;

      }


      // =================================================
      // บัญชีถูกระงับ
      // =================================================

      if (
        result.blocked
      ) {

        statusElement.className =
          'status error';


        statusElement.innerHTML =
          'บัญชีของคุณถูกระงับการใช้งาน<br><br>' +
          'กรุณาติดต่อผู้ดูแลระบบ';


        return;

      }


      // =================================================
      // ผู้ใช้ปกติ
      // =================================================

      currentUser =
        result;


      await showSearchScreen();


    } catch (
      error
    ) {

      console.error(
        error
      );


      statusElement.className =
        'status error';


      statusElement.innerHTML =
        'เกิดข้อผิดพลาด<br><br>' +
        error.message;

    }

  }



  // =====================================================
  // หน้าลงทะเบียน
  // =====================================================

  function showRegisterScreen() {

    const statusElement =
      document.getElementById(
        'status'
      );


    statusElement.className =
      'status';


    statusElement.innerHTML =
      'ยังไม่พบการลงทะเบียนของบัญชีนี้<br><br>' +
      'กรุณากรอกรหัสพนักงานเพื่อเปิดใช้งาน';


    document
      .getElementById(
        'registerSection'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'searchSection'
      )
      .classList
      .add(
        'hidden'
      );

  }



  // =====================================================
  // ลงทะเบียนผู้ใช้
  // =====================================================

  async function registerUser() {

    const employeeId =
      document
        .getElementById(
          'employeeId'
        )
        .value
        .trim();


    const registerButton =
      document.getElementById(
        'registerButton'
      );


    const statusElement =
      document.getElementById(
        'status'
      );


    if (
      !employeeId
    ) {

      statusElement.className =
        'status error';


      statusElement.innerHTML =
        'กรุณากรอกรหัสพนักงาน';


      return;

    }


    if (
      !/^\d{6,15}$/.test(
        employeeId
      )
    ) {

      statusElement.className =
        'status error';


      statusElement.innerHTML =
        'รูปแบบรหัสพนักงานไม่ถูกต้อง';


      return;

    }


    try {

      registerButton.disabled =
        true;


      registerButton.innerHTML =
        'กำลังลงทะเบียน...';

        );


    const cachedMenuData =
      readMenuCacheFromStorage();


    // =================================================
    // Cache สด <= 48 ชั่วโมง
    // ใช้ชื่อเมนูจากเครื่องทันที
    // =================================================

    if (
      cachedMenuData.fresh &&
      cachedMenuData.menus.length > 0
    ) {

      menuCache =
        cachedMenuData.menus;


      pageDiagnostics.menuCacheSource =
        'localStorage (fresh)';


      pageDiagnostics.menuCacheAgeMs =
        cachedMenuData.ageMs;


      searchMessage.innerHTML =
        'พร้อมค้นหา ' +
        menuCache.length +
        ' เมนู';


      await finishSearchScreenLoad();


      // ทำหลัง Page Load เสร็จแล้ว
      // จึงไม่บังคับให้ผู้ใช้รอ getMenuList
      refreshMenuListInBackground();


      return;

    }


    // =================================================
    // ไม่มี Cache สด
    // โหลด API ตาม Flow เดิม
    // =================================================

    pageDiagnostics.menuCacheSource =
      'API';


    pageDiagnostics.menuCacheAgeMs =
      cachedMenuData.ageMs;


    const menuLoaded =
      await loadMenuList(
        false
      );


    if (
      menuLoaded
    ) {

      await finishSearchScreenLoad();

      return;

    }


    // =================================================
    // API ล้ม แต่มี Cache เก่าที่หมดอายุ
    // ใช้เป็น fallback เพื่อให้ยังค้นหาได้
    // =================================================

    if (
      cachedMenuData.menus.length > 0
    ) {

      menuCache =
        cachedMenuData.menus;


      pageDiagnostics.menuCacheSource =
        'localStorage (stale fallback)';


      pageDiagnostics.menuCacheAgeMs =
        cachedMenuData.ageMs;


      searchMessage.innerHTML =
        'พร้อมค้นหา ' +
        menuCache.length +
        ' เมนู';


      await finishSearchScreenLoad();

    }

  }

  // =====================================================
  // Local Search + Fuzzy Search
  // =====================================================

  function runLocalSearch(
    keyword
  ) {

    const normalizedKeyword =
      normalizeText(
        keyword
      );


    const scoredResults =
      menuCache
        .map(
          function(
            item
          ) {

            const menuName =
              item.menuName || '';


            const normalizedMenu =
              normalizeText(
                menuName
              );


            const score =
              calculateMatchScore(
                normalizedKeyword,
                normalizedMenu
              );


            return {

              menuName:
                menuName,

              score:
                score

            };

          }
        )
        .filter(
          function(
            item
          ) {

            return (
              item.score > 0
            );

          }
        )
        .sort(
          function(
            a,
            b
          ) {

            return (
              b.score -
              a.score
            );

          }
        )
        .slice(
          0,
          10
        );


    displaySuggestions(
      scoredResults
    );

  }



  // =====================================================
  // คำนวณคะแนนความใกล้เคียง
  // =====================================================

  function calculateMatchScore(
    keyword,
    menuName
  ) {

    if (
      !keyword ||
      !menuName
    ) {

      return 0;

    }


    // ตรงทั้งหมด
    if (
      menuName ===
      keyword
    ) {

      return 1000;

    }


    // ขึ้นต้นเหมือนกัน
    if (
      menuName.startsWith(
        keyword
      )
    ) {

      return (
        800 -
        (
          menuName.length -
          keyword.length
        )
      );

    }


    // มีคำอยู่ภายใน
    if (
      menuName.includes(
        keyword
      )
    ) {

      return (
        600 -
        menuName.indexOf(
          keyword
        )
      );

    }


    // Fuzzy Search ด้วย Levenshtein Distance
    const distance =
      levenshteinDistance(
        keyword,
        menuName
      );


    const maxLength =
      Math.max(
        keyword.length,
        menuName.length
      );


    const similarity =
      1 -
      (
        distance /
        maxLength
      );


    // แสดงเฉพาะที่คล้ายพอสมควร
    if (
      similarity >= 0.45
    ) {

      return (
        similarity *
        400
      );

    }


    return 0;

  }



  // =====================================================
  // Levenshtein Distance
  // =====================================================

  function levenshteinDistance(
    a,
    b
  ) {

    const matrix =
      [];


    for (
      let i = 0;
      i <= b.length;
      i++
    ) {

      matrix[i] =
        [i];

    }


    for (
      let j = 0;
      j <= a.length;
      j++
    ) {

      matrix[0][j] =
        j;

    }


    for (
      let i = 1;
      i <= b.length;
      i++
    ) {

      for (
        let j = 1;
        j <= a.length;
        j++
      ) {

        if (
          b.charAt(
            i - 1
          ) ===
          a.charAt(
            j - 1
          )
        ) {

          matrix[i][j] =
            matrix[i - 1][j - 1];

        } else {

          matrix[i][j] =
            Math.min(

              matrix[i - 1][j - 1] + 1,

              matrix[i][j - 1] + 1,

              matrix[i - 1][j] + 1

            );

        }

      }

    }


    return (
      matrix[b.length][a.length]
    );

  }

  // =====================================================
  // เปิดสูตรจริงจาก Backend
  // =====================================================

  async function openRecipe(
    menuName
  ) {

    const searchMessage =
      document.getElementById(
        'searchMessage'
      );


    try {

      if (
        searchStartTime === null
      ) {

        searchStartTime =
          performance.now();

      }


      searchMessage.innerHTML =
        'กำลังโหลดสูตร...';


      const result =
        await callApi({

          source:
            'LIFF',

          action:
            'getRecipe',

          idToken:
            currentIdToken,

          menuName:
            menuName,

          debug:
            DEBUG_MODE

        });


      saveBackendDiagnostics(
        'getRecipe',
        result
      );


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          'ไม่สามารถโหลดสูตรได้'
        );

      }


      displayRecipe(
        result.recipe
      );


      // รอให้เบราว์เซอร์วาดสูตรลงหน้าจอจริง
      await waitForNextPaint();


      searchTaskTime =
        searchStartTime !== null
          ? Math.round(
              performance.now() -
              searchStartTime
            )
          : 0;


      // Total Retrieval Time ใช้ผลรวมของเวลาโหลดระบบ
      // และเวลาค้นหาสูตร เพื่อไม่รวมเวลาที่ผู้ใช้หยุดรอก่อนเริ่มพิมพ์
      totalRetrievalTime =
        pageLoadTime +
        searchTaskTime;


      // เก็บค่าของรอบที่เพิ่งสำเร็จไว้เป็น local snapshot
      // ก่อน reset timer เพื่อให้การค้นหารอบถัดไปเริ่มนับใหม่ทันที
      const completedSearchTaskTime =
        searchTaskTime;


      const completedTotalRetrievalTime =
        totalRetrievalTime;


      const displayedMenuName =
        result.recipe &&
        result.recipe.menuName
          ? result.recipe.menuName
          : menuName;


      const responseTime =
        Number.isFinite(
          Number(
            result.responseTime
          )
        )
          ? Math.round(
              Number(
                result.responseTime
              )
            )
          : 0;


      console.log(
        '[Performance Metrics]',
        {
          responseTime:
            responseTime,

          pageLoadTime:
            pageLoadTime,

          searchTaskTime:
            completedSearchTaskTime,

          totalRetrievalTime:
            completedTotalRetrievalTime,

          menuName:
            displayedMenuName
        }
      );


      // สูตรแสดงสำเร็จ = จบรอบการค้นหานี้
      // reset ก่อนส่ง Log เพื่อให้ผู้ใช้เริ่มค้นหารอบใหม่ได้ทันที
      // แม้การบันทึก Log ของรอบก่อนยังดำเนินอยู่
      resetSearchTiming();


      // สูตรแสดงแล้ว จึงล้างข้อความโหลดก่อนบันทึก Log
      searchMessage.innerHTML =
        '';


      // ส่งข้อมูลการใช้งานไปบันทึกใน Google Sheets
      // ใช้ค่าที่ snapshot ไว้ก่อน reset
      // หากการบันทึก Log ล้มเหลว สูตรที่แสดงอยู่จะไม่หาย
      await sendRecipeLog({

        menuName:
          displayedMenuName,

        intent:
          'เปิดสูตร',

        responseTime:
          responseTime,

        pageLoadTime:
          pageLoadTime,

        searchTaskTime:
          completedSearchTaskTime,

        totalRetrievalTime:
          completedTotalRetrievalTime

      });


    } catch (
      error
    ) {

      console.error(
        error
      );


      searchMessage.innerHTML =
        'เกิดข้อผิดพลาด: ' +
        error.message;

    }

  }

  // =====================================================
  // รีเซ็ตเวลาของรอบค้นหา
  // =====================================================

  function resetSearchTiming() {

    searchStartTime =
      null;

    searchTaskTime =
      0;

    totalRetrievalTime =
      0;

  }



  // =====================================================
  // รอให้เบราว์เซอร์วาดหน้าจอเสร็จ
  // =====================================================

  function waitForNextPaint() {

    return new Promise(
      function(
        resolve
      ) {

        requestAnimationFrame(
          function() {

            requestAnimationFrame(
              resolve
            );

          }
        );

      }
    );

  }



  // =====================================================
  // Normalize Text
  // =====================================================

  function normalizeText(
    text
  ) {

    return String(
      text || ''
    )
      .toLowerCase()
      .trim()
      .replace(
        /\s+/g,
        ''
      );

  }



  // =====================================================
  // ป้องกัน HTML Injection
  // =====================================================

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        'div'
      );


    div.textContent =
      text;


    return div.innerHTML;

  }



  // =====================================================
  // เรียก Apps Script API
  //
  // STEP 1: Stability
  // - มี Timeout ต่อ Request
  // - Retry เฉพาะ Action ที่เป็นการอ่านข้อมูล
  // - ไม่ Retry register / logRecipe เพื่อป้องกันข้อมูลซ้ำ
  // - เก็บ HTTP diagnostics ใน Console
  // =====================================================

  const API_TIMEOUT_MS =
    12000;


  const RETRYABLE_READ_ACTIONS =
    new Set([
      'checkUser',
      'getMenuList',
      'getRecipe'
    ]);


  const RETRY_DELAYS_MS =
    [
      500,
      1200
    ];


  function wait(
    milliseconds
  ) {

    return new Promise(
      function(
        resolve
      ) {

        setTimeout(
          resolve,
          milliseconds
        );

      }
    );

  }


  function shouldRetryHttpStatus(
    status
  ) {

    return (
      status === 408 ||
      status === 429 ||
      status >= 500
    );

  }


  async function callApi(
    payload
  ) {

    const action =
      String(
        payload &&
        payload.action
          ? payload.action
          : ''
      );


    const canRetry =
      RETRYABLE_READ_ACTIONS.has(
        action
      );


    const maxAttempts =
      canRetry
        ? RETRY_DELAYS_MS.length + 1
        : 1;


    let lastError =
      null;


    for (
      let attempt = 1;
      attempt <= maxAttempts;
      attempt++
    ) {

      const controller =
        new AbortController();


      const timeoutId =
        setTimeout(
          function() {

            controller.abort();

          },
          API_TIMEOUT_MS
        );


      const requestStartedAt =
        performance.now();


      try {

        const response =
          await fetch(
            API_URL,
            {

              method:
                'POST',

              headers: {

                'Content-Type':
                  'text/plain;charset=utf-8'

              },

              body:
                JSON.stringify(
                  payload
                ),

              signal:
                controller.signal

            }
          );


        const durationMs =
          Math.round(
            performance.now() -
            requestStartedAt
          );


        const responseText =
          await response.text();


        if (
          Object.prototype.hasOwnProperty.call(
            pageDiagnostics.lastHttpStatus,
            action
          )
        ) {

          pageDiagnostics.lastHttpStatus[
            action
          ] =
            response.status;


          updateDebugPanel();

        }


        console.log(
          '[API]',
          {
            action:
              action,

            attempt:
              attempt,

            status:
              response.status,

            durationMs:
              durationMs
          }
        );


        if (
          !response.ok
        ) {

          const httpError =
            new Error(
              'HTTP ' +
              response.status
            );


          httpError.name =
            'ApiHttpError';


          httpError.status =
            response.status;


          httpError.responsePreview =
            responseText
              .slice(
                0,
                300
              );


          throw httpError;

        }


        try {

          return JSON.parse(
            responseText
          );

        } catch (
          parseError
        ) {

          const apiParseError =
            new Error(
              'รูปแบบข้อมูลตอบกลับจากระบบไม่ถูกต้อง'
            );


          apiParseError.name =
            'ApiParseError';


          apiParseError.responsePreview =
            responseText
              .slice(
                0,
                300
              );


          throw apiParseError;

        }


      } catch (
        error
      ) {

        lastError =
          error;


        const durationMs =
          Math.round(
            performance.now() -
            requestStartedAt
          );


        const isTimeout =
          error &&
          error.name ===
            'AbortError';


        const isNetworkError =
          error instanceof TypeError;


        const isHttpRetryable =
          error &&
          error.name ===
            'ApiHttpError' &&
          shouldRetryHttpStatus(
            error.status
          );


        const isParseError =
          error &&
          error.name ===
            'ApiParseError';


        const retryableFailure =
          canRetry &&
          (
            isTimeout ||
            isNetworkError ||
            isHttpRetryable ||
            isParseError
          );


        console.warn(
          '[API Error]',
          {
            action:
              action,

            attempt:
              attempt,

            durationMs:
              durationMs,

            errorName:
              error &&
              error.name
                ? error.name
                : 'Error',

            message:
              error &&
              error.message
                ? error.message
                : 'Unknown error',

            status:
              error &&
              error.status
                ? error.status
                : null,

            responsePreview:
              error &&
              error.responsePreview
                ? error.responsePreview
                : ''
          }
        );


        if (
          !retryableFailure ||
          attempt >= maxAttempts
        ) {

          break;

        }


        const delayMs =
          RETRY_DELAYS_MS[
            attempt - 1
          ];


        if (
          Object.prototype.hasOwnProperty.call(
            pageDiagnostics.retries,
            action
          )
        ) {

          pageDiagnostics.retries[
            action
          ] += 1;


          updateDebugPanel();

        }


        console.warn(
          '[API Retry]',
          {
            action:
              action,

            nextAttempt:
              attempt + 1,

            delayMs:
              delayMs
          }
        );


        await wait(
          delayMs
        );


      } finally {

        clearTimeout(
          timeoutId
        );

      }

    }


    if (
      lastError &&
      lastError.name ===
        'AbortError'
    ) {

      throw new Error(
        'การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่อีกครั้ง'
      );

    }


    if (
      lastError &&
      lastError.name ===
        'ApiHttpError'
    ) {

      throw new Error(
        'ไม่สามารถเชื่อมต่อระบบได้ (HTTP ' +
        lastError.status +
        ')'
      );

    }


    if (
      lastError &&
      lastError.name ===
        'ApiParseError'
    ) {

      throw new Error(
        'ระบบตอบกลับข้อมูลไม่สมบูรณ์ กรุณาลองใหม่อีกครั้ง'
      );

    }


    throw new Error(
      'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง'
    );

  }



  // =====================================================
  // เริ่มระบบ
  // =====================================================

  window.addEventListener(
    'load',
    function() {

      updateDebugPanel();

      initializeLiff();

    }
  );

</script>
